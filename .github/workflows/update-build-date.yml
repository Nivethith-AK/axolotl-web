name: Update build date

on:
  push:
    branches: [main]

jobs:
  update-build-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write build-info.json
        run: |
          echo "{\"built\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > public/build-info.json

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/build-info.json
          git diff --cached --quiet || git commit -m "chore: update build date [skip ci]"
          git push
